<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escape Market</title>
</head>

<body>
    <div class="site-shell">
    <input aria-describedby="reading-mode-description" class="reading-mode-input" id="reading-mode" type="checkbox">
    <div class="site-content">

    <header class="site-header">
        <div><a aria-label="Escape Market forside" class="brand" href="index.html"><span aria-hidden="true" class="brand-mark"> E </span><span> scape Market </span></a><p>Markedsplads og byttecentral for escape room-spil</p></div>
        <label class="reading-toggle" for="reading-mode"><span aria-hidden="true" class="toggle-track"><span></span></span><span>Ordblindevenlig tekst<small>Skifter til en enklere skrifttype</small></span></label>
    </header>
    <nav aria-label="Primær navigation" class="main-nav">
        <div class="nav-links-desktop"><a href="index.html">Forside</a><a class="active" href="buy.html">Køb brugte spil</a><a href="sell.html">Sælg</a><a href="trade.html">Byttecentralen</a><a href="account-form.html">Opret profil</a><a href="about.html">Om</a></div>
        <details class="nav-menu"><summary><span>Menu</span><span aria-hidden="true" class="nav-menu-icon"></span></summary><div class="nav-links-dropdown"><a href="index.html">Forside</a><a class="active" href="buy.html">Køb brugte spil</a><a href="sell.html">Sælg</a><a href="trade.html">Byttecentralen</a><a href="account-form.html">Opret profil</a><a href="about.html">Om</a></div></details>
    </nav>

    <main>
        <h2 id="used-games">Brugte spil</h2>

        <div class="filters">
            <div class="filter">
                <label for="language-filter">Sprog</label>
                <select id="language-filter">
                    <option value="">Alle</option>
                    <option value="Dansk">Dansk</option>
                    <option value="Engelsk">Engelsk</option>
                </select>
            </div>
            <div class="filter">
                <label for="condition-filter">Stand</label>
                <select id="condition-filter">
                    <option value="">Alle</option>
                    <option value="Uåbnet">Uåbnet</option>
                    <option value="Som ny">Som ny</option>
                    <option value="God, men brugt">God, men brugt</option>
                    <option value="Kræver reperation">Kræver reperation</option>
                </select>
            </div>
            <div class="filter">
                <label for="price-filter">Pris</label>
                <input type="number" id="price-filter" min="0" placeholder="Maks. pris i kr."></input>
            </div>
            <div class="filter">
                <label for="search-filter">Søg efter spil</label>
                <input type="text" id="search-filter" placeholder="F.eks. Unlock"></input>
            </div>
            <div class="filter">
                <label for="sort-filter">Sortér efter</label>
                <select id="sort-filter">
                    <option value="">Standard</option>
                    <option value="price-asc">Pris: Lav til høj</option>
                    <option value="price-desc">Pris: Høj til lav</option>
                    <option value="title-asc">Spil: A til Å</option>
                    <option value="title-desc">Pris: Å til A</option>
                </select>
            </div>
        </div>

        <div class="game-list">
        </div>

    </main>

    <footer class="site-footer">© 2025 Escape Market</footer>
    </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>

</body>

</html>
