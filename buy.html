<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escape Market</title>
</head>
<body>

    <header> 
        <h1>Escape Market</h1>
        <p>Unlock new adventures! Køb, sælg eller byt brugte escape room spil.</p>
        <nav class="navigation">
            <a href="index.html">Forside</a>
            <a href="buy.html">Køb brugte spil</a>
            <a href="sell.html">Sælg</a>
            <a href="trade.html">Byttecentralen</a>
            <a href="about.html">Om</a>
        </nav>
    </header>

    <main>
        <h2 id="used-games">Brugte spil</h2>

        <section class="filter-section">
            <article class="dropdown-filters">
                <div class="dropdown">
                    <button class="dropdown__select" aria-haspopup="listbox" aria-expanded="true">
                        <span class="dropdown__select-label">Sprog</span>
                    </button>
                    <nav class="dropdown__container" role="listbox">
                        <ul class="dropdown__list">
                            <li class="dropdown__list-item">
                                <label for="check" class="dropdown__checkbox">
                                    <input type="checkbox" value="Dansk">
                                    <span class="dropdown__checkbox-label">
                                        Dansk
                                    </span>
                                </label>
                            </li>
                            <li class="dropdown__list-item">
                                <label for="check" class="dropdown__checkbox">
                                    <input type="checkbox" value="Engelsk">
                                    <span class="dropdown__checkbox-label">
                                        Engelsk
                                    </span>
                                </label>
                            </li>
                        </ul>
                    </nav>
                </div>
            </article>
        </section>
        
        <section>
            <div class="game-list">
            </div>
        </section>
    </main>
    
    <footer>
        <p>© 2026 Escape Market</p>
    </footer>

    <script src="script.js"></script>

</body>

</html>
