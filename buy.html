<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escape Market</title>
</head>

<body>

    <header>
        <h1>Escape Market</h1>
        <p>Unlock new adventures! Køb, sælg eller byt brugte escape room spil.</p>
        <nav class="navigation">
            <a href="index.html">Forside</a>
            <a href="buy.html">Køb brugte spil</a>
            <a href="sell.html">Sælg</a>
            <a href="trade.html">Byttecentralen</a>
            <a href="about.html">Om</a>
        </nav>
    </header>

    <main>
        <h2 id="used-games">Brugte spil</h2>

        <div class="filters">
            <div class="filter">
                <label for="language-filter">Sprog</label>
                <select id="language-filter">
                    <option value="">Alle</option>
                    <option value="Dansk">Dansk</option>
                    <option value="Engelsk">Engelsk</option>
                </select>
            </div>
            <div class="filter">
                <label for="condition-filter">Stand</label>
                <select id="condition-filter">
                    <option value="">Alle</option>
                    <option value="Uåbnet">Uåbnet</option>
                    <option value="Som ny">Som ny</option>
                    <option value="God, men brugt">God, men brugt</option>
                    <option value="Kræver reperation">Kræver reperation</option>
                </select>
            </div>
            <div class="filter">
                <label for="price-filter">Pris</label>
                <input type="number" id="price-filter" min="0" placeholder="Maks. pris i kr."></input>
            </div>
            <div class="filter">
                <label for="search-filter">Søg efter spil</label>
                <input type="text" id="search-filter" placeholder="F.eks. Unlock"></input>
            </div>
            <div class="filter">
                <label for="sort-filter">Sortér efter</label>
                <select id="sort-filter">
                    <option value="">Standard</option>
                    <option value="price-asc">Pris: Lav til høj</option>
                    <option value="price-desc">Pris: Høj til lav</option>
                    <option value="title-asc">Spil: A til Å</option>
                    <option value="title-desc">Pris: Å til A</option>
                </select>
            </div>
        </div>

        <div class="game-list">
        </div>

    </main>

    <footer>
        <p>© 2026 Escape Market</p>
    </footer>

    <script src="script.js"></script>

</body>

</html>
